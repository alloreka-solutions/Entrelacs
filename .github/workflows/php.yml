name: PHP checks

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite
          coverage: none

      - name: Check PHP syntax
        run: find app public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run SQLite migration smoke test
        run: php tests/smoke.php
